# Table d'identité des blockchains.
#
# C'est le fichier fondateur du projet, et la raison est simple : les quatre
# sources de données appellent la même chaîne de quatre façons différentes.
# DexScreener dit `bsc`, GoPlus dit `56`, Etherscan dit `chainid=56`,
# l'utilisateur dit « BNB Chain ». Sans cette table, chaque skill réinvente sa
# propre correspondance et le premier oubli fait qu'un jeton passe l'analyse de
# momentum sans jamais passer l'analyse de sécurité.
#
# Ajouter une chaîne, c'est ajouter une entrée ici. Aucun autre fichier ne
# nomme une blockchain.
#
# `quotes` : les seuls jetons de cotation acceptés. Une paire cotée en un autre
# jeton donne des montants en dollars dérivés d'un actif lui-même volatil ou
# illiquide — et c'est le montage exact des faux volumes : créer une paire
# SCAM/AUTRESCAM, faire tourner les deux, et laisser l'agrégateur convertir en
# dollars imaginaires. Les adresses sont en minuscules, la comparaison aussi.
#
# Une adresse erronée ici écarte un jeton légitime : elle ne fabrique jamais une
# fausse alerte. C'est le bon sens de l'échec, mais il vaut mieux les vérifier
# avant la première mise en service.

ethereum:
  nom: Ethereum
  goplus: "1"                       # identifiant numérique EVM, aussi valable pour Etherscan V2
  honeypot_is: 1                    # simulateur d'achat/revente : ETH, BSC et Base seulement
  explorateur: "https://etherscan.io/token/"
  # Le gaz coûte plusieurs dollars : sous 80 000 $ de liquidité, les frais
  # d'entrée et de sortie mangent la thèse. Plancher plus haut qu'ailleurs.
  liquidite_min_usd: 80000
  quotes:
    - "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"   # WETH
    - "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"   # USDC
    - "0xdac17f958d2ee523a2206206994597c13d831ec7"   # USDT
    - "0x6b175474e89094c44da98b954eedeac495271d0f"   # DAI
    - "0x2260fac5e5542a773aa44fbcfedf7c193bc2c599"   # WBTC

