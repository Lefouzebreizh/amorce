solana:
  nom: Solana
  goplus: solana                    # point d'entrée distinct : /api/v1/solana/token_security
  honeypot_is: null                 # remplacé par RugCheck, qui ne connaît que Solana
  explorateur: "https://solscan.io/token/"
  # Les frais sont négligeables et les paires y naissent par milliers : un
  # plancher plus bas garde des candidats réels sans ouvrir la porte aux scams,
  # que le bouclier arrête de toute façon.
  liquidite_min_usd: 30000
  # Les adresses Solana sont sensibles à la casse (base58) : pas de minuscules ici.
  sensible_a_la_casse: true
  quotes:
    - "So11111111111111111111111111111111111111112"   # WSOL
    - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"  # USDC
    - "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"  # USDT
