# Mise en ligne du réseau d'annuaires sur GitHub Pages.
#
# Jusqu'ici le réseau publiait dans le dépôt et nulle part ailleurs : onze
# sites parfaitement construits, zéro visiteur possible. `construire-sites.js`
# fabriquait déjà `dist/<niche>/` ; il manquait la main qui dépose le dossier.
#
# Quatre décisions, chacune payée par une mesure ou par un piège connu :
#
# * **Un seul projet Pages, onze sous-dossiers.** `dist/` déposé tel quel donne
#   `…/immobilier/`, `…/btp/`, et le gabarit s'en accommode sans une ligne de
#   changement : mesuré, toutes ses références sont relatives (`styles.css`,
#   `niches/<id>.json`). C'est la forme la moins chère pour la phase de mesure ;
#   le jour où un domaine est acheté, `regler-domaines.mjs <niche> <adresse>`
#   bascule cette niche-là et elle seule.
# * **Un seul site, et pas d'aperçu.** Le gabarit réécrit sa balise canonique
#   depuis l'adresse courante — vérifié : servi en local, il se déclare
#   canonique sur `127.0.0.1`. Un déploiement d'aperçu servi sur son propre
#   sous-domaine se déclarerait donc canonique lui aussi et concurrencerait la
#   production dans l'index. GitHub Pages n'expose qu'un site par dépôt et son
#   mode aperçu n'est pas public : ce que Cloudflare demandait d'éviter à la
#   main, par un `--branch=main` explicite, ne peut plus arriver ici.
# * **Appelable par l'auto-pilote (`workflow_call`).** Une poussée faite avec le
#   jeton d'Actions ne déclenche aucun workflow — protection anti-boucle de
#   GitHub, pas un réglage. Sans cet appel explicite, l'outil publié le lundi
#   n'apparaîtrait en ligne que le mercredi, et rien ne le signalerait.
# * **Sans la source Pages réglée, on prévient, on continue — et on ouvre un
#   billet.**
#   Échouer rendrait l'auto-pilote rouge tous les deux jours, et une barrière
#   rouge en permanence est une barrière qu'on cesse de lire ; la publication
#   dans le dépôt, elle, a bien eu lieu. Mais l'avertissement seul ne suffit
#   pas, et c'est mesuré : cinq exécutions vertes de suite n'ont **rien**
#   déposé, deux sessions ont cru la mise en ligne faite, et personne ne l'a
#   vu — il faut ouvrir le journal d'exécution pour lire un avertissement.
#   Un billet, lui, arrive dans les notifications. Il se referme tout seul au
#   premier dépôt réussi : une alerte qu'on doit fermer à la main finit par
#   rester ouverte pour rien.
#
# **Pourquoi GitHub Pages et non Cloudflare, décidé le 02/09/2026.** Les onze
# bases déclarent déjà `ma-panoplie-ia.com/<niche>/` dans chaque balise
# canonique, chaque sitemap et chaque `og:url`. Publier ailleurs — sur un
# `*.pages.dev` ou sur un sous-chemin `github.io/amorce/` — obligeait à changer
# cette adresse, donc à la faire indexer pour la remplacer ensuite : sur un
# projet qui ne vaut que par son référencement, une adresse provisoire n'est
# pas un raccourci, c'est une dette. GitHub Pages sert le domaine à sa racine,
# gratuitement, sur un dépôt public — et sans les deux secrets ni le compte
# tiers que Cloudflare réclamait.
#
# Réglages à faire une fois, et **aucun n'est automatisable d'ici** :
#
# 1. Chez le registrar : quatre `A` sur l'apex vers 185.199.108.153,
#    185.199.109.153, 185.199.110.153 et 185.199.111.153, plus un `CNAME`
#    `www` vers `lefouzebreizh.github.io`.
# 2. Settings → Pages → Source → **GitHub Actions**. L'entrée `enablement` de
#    `actions/configure-pages` le ferait — mais son `action.yml` exige en
#    propres termes un jeton *autre* que `GITHUB_TOKEN`, que ce workflow n'a
#    pas. D'où la détection plus bas plutôt qu'une tentative vouée à échouer.
#    Et cette détection lit `build_type` par l'API, **pas** le succès de
#    `configure-pages` : celui-ci réussit aussi sur une source « branche », ce
#    qui a rendu le billet muet le jour même où il devait servir.
# 3. Settings → Pages → Custom domain → `ma-panoplie-ia.com`, puis *Enforce
#    HTTPS* une fois le certificat émis.

name: Annuaire IA — mise en ligne

on:
  push:
    branches: [main]
    paths:
      - 'annuaire-ia/**'
      - '.github/workflows/annuaire-ia-pages.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write
  # `actions/deploy-pages` s'authentifie par OIDC : sans `id-token: write` il
  # ne peut pas prouver son identité, et le dépôt est refusé sans que la cause
  # apparaisse dans le journal.
  pages: write
  id-token: write

# Deux dépôts simultanés sur le même site se marchent dessus. On ne coupe plus
# celui qui est en cours, contrairement au temps de Cloudflare : un dépôt Pages
# interrompu en plein vol laisse un déploiement bloqué côté GitHub, qui refuse
# les suivants. On laisse donc finir, et le suivant passe derrière.
concurrency:
  group: pages-annuaire-ia
  cancel-in-progress: false

jobs:
  deployer:
    name: Construire et déposer les onze sites
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.depot.outputs.page_url }}
    defaults:
      run:
        working-directory: annuaire-ia

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # `main` explicitement, et non le SHA du déclencheur : appelé par
          # l'auto-pilote, ce workflow hérite sinon de l'état d'avant la
          # publication et met en ligne le catalogue de l'avant-veille.
          ref: main

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Tailwind vient des dépendances d'Amorce, à la racine — même motif que
      # la barrière de vérification du réseau.
      - name: Installer les dépendances du dépôt
        working-directory: .
        run: npm ci

      # GitHub Pages ne demande aucun secret. Il demande une chose que le dépôt
      # ne porte pas : que la source soit réglée sur « GitHub Actions ». Tant
      # qu'elle reste sur « Deploy from a branch », cette étape échoue — d'où
      # le `continue-on-error`, qui la transforme en détection au lieu d'un
      # arrêt, exactement comme le faisait la sonde de secrets Cloudflare.
      # GitHub Pages ne demande aucun secret. Il demande une chose que le dépôt
      # ne porte pas : que la source soit réglée sur « GitHub Actions ».
      #
      # `actions/configure-pages` ne sait PAS le dire, et c'est le piège qui a
      # coûté un lot entier le 02/09/2026. Son `src/api-client.js` appelle
      # `GET /repos/…/pages` et réussit dès qu'une page existe — **quelle que
      # soit sa source**. Ce dépôt avait Pages activé en mode « branche », donc
      # la détection passait au vert, le billet ne s'ouvrait jamais, et le dépôt
      # se serait tenté pour rien.
      #
      # On lit donc `build_type` nous-mêmes : « workflow » = prêt, « legacy » =
      # source encore sur une branche. Un appel refusé rend « introuvable », qui
      # compte comme pas prêt : on préfère un billet de trop à un dépôt muet.
      - name: La source Pages est-elle réglée sur Actions
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo introuvable)
          echo "Source Pages : $type"
          if [ "$type" = "workflow" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Source Pages « $type » : les sites sont construits mais pas déposés. Settings → Pages → Source → GitHub Actions."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          fi

      # Un avertissement vit dans le journal d'exécution, que personne n'ouvre.
      # Celui-ci arrive dans les notifications, et une seule fois : si le billet
      # est déjà ouvert, on n'y ajoute rien.
      - name: Signaler que le réseau n'est toujours pas en ligne
        if: steps.source.outputs.pret == 'non'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          titre="Le réseau d'annuaires n'est pas encore en ligne"
          existant=$(gh issue list --state open --search "$titre in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existant" ]; then
            echo "Billet #$existant déjà ouvert, rien à ajouter."
            exit 0
          fi
          cat > /tmp/corps.md <<'TEXTE'
          Les onze sites sont construits et contrôlés à chaque poussée, mais **rien n'est déposé** : la source Pages du dépôt n'est pas réglée sur « GitHub Actions », l'étape de dépôt est sautée, et l'exécution reste verte.

          Tant que ce billet est ouvert, le réseau publie dans le dépôt et nulle part ailleurs — les balises canoniques annoncent une adresse que personne ne sert.

          Trois gestes, une fois pour toutes. Aucun ne peut être fait depuis une session : les deux premiers vivent hors du dépôt, et le troisième exige un jeton que ce workflow n'a pas.

          1. **Chez le registrar de `ma-panoplie-ia.com`** → quatre enregistrements `A` sur l'apex vers `185.199.108.153`, `185.199.109.153`, `185.199.110.153`, `185.199.111.153`, plus un `CNAME` `www` vers `lefouzebreizh.github.io`.
          2. **GitHub** → Settings → Pages → Source → **GitHub Actions**.
          3. **GitHub** → Settings → Pages → Custom domain → `ma-panoplie-ia.com`, puis *Enforce HTTPS* dès que la case se débloque.

          Ce billet se referme tout seul au premier dépôt réussi.
          TEXTE
          gh issue create --title "$titre" --body-file /tmp/corps.md

      # `construire-sites.js` valide les bases et s'arrête sur la première
      # erreur : une base cassée ne peut pas atteindre l'hébergeur.
      - name: Construire les onze sites
        run: |
          node construire-styles.mjs
          node construire-sites.js

      # Le parcours en navigateur n'est PAS rejoué ici, et c'est délibéré :
      # `verifier.mjs` sert les sources, pas `dist/`, et l'auto-pilote l'a déjà
      # passé avant de pousser. Le relancer coûterait trois minutes par dépôt
      # pour redire ce qu'on sait.
      #
      # Ce qui n'était vérifié nulle part, en revanche, c'est le dossier
      # réellement déposé : un site oublié ou une balise canonique restée sur
      # l'adresse d'un tiers ne casse rien de visible et s'indexe pourtant.
      - name: Contrôler ce qui va être déposé
        run: |
          node -e "
          const fs = require('node:fs'), path = require('node:path');
          const niches = fs.readdirSync('niches').filter(f => f.endsWith('.json'));
          let fautes = 0;
          for (const f of niches) {
            const base = JSON.parse(fs.readFileSync(path.join('niches', f), 'utf8'));
            const id = base.niche.id;
            // Une niche en pause n'est plus construite : lui réclamer un dossier
            // ferait échouer le dépôt du seul site réellement en ligne.
            if (base.niche.actif === false) { console.log('  (' + id + ') en pause, non construite'); continue; }
            if (!base.outils.length) { console.log('  (' + id + ') niche vide, non construite'); continue; }
            const dossier = path.join('dist', id);
            for (const attendu of ['index.html', 'styles.css', 'sitemap.xml', 'robots.txt', 'niches/' + id + '.json']) {
              if (!fs.existsSync(path.join(dossier, attendu))) { console.error('  ✗ ' + id + ' : ' + attendu + ' manquant'); fautes++; }
            }
            const page = fs.readFileSync(path.join(dossier, 'index.html'), 'utf8');
            const canonique = /<link rel=\"canonical\" href=\"([^\"]*)\">/.exec(page)?.[1] ?? '';
            if (!canonique.startsWith(base.niche.domaine)) {
              console.error('  ✗ ' + id + ' : canonique ' + canonique + ' hors du domaine ' + base.niche.domaine);
              fautes++;
            } else { console.log('  ✓ ' + id.padEnd(14) + canonique); }
          }
          if (fautes) { console.error('\n' + fautes + ' faute(s) : rien n\'est déposé.'); process.exit(1); }
          console.log('\nDossier de dépôt conforme.');
          "

      - name: Préparer le dépôt Pages
        if: steps.source.outputs.pret == 'oui'
        uses: actions/configure-pages@v6

      - name: Empaqueter les onze sites
        if: steps.source.outputs.pret == 'oui'
        uses: actions/upload-pages-artifact@v5
        with:
          # Chemin depuis la racine du dépôt, et non depuis `annuaire-ia` :
          # `defaults.run.working-directory` ne vaut que pour les étapes `run`,
          # jamais pour une action. Un chemin relatif ici empaquetterait le
          # vide, et le dépôt réussirait en servant un site introuvable.
          path: annuaire-ia/dist

      - name: Déposer sur GitHub Pages
        id: depot
        if: steps.source.outputs.pret == 'oui'
        uses: actions/deploy-pages@v5

      # Le premier dépôt réussi rend le billet caduc : le laisser ouvert
      # apprendrait à ignorer les billets de ce dépôt.
      - name: Refermer le billet de mise en ligne
        if: steps.source.outputs.pret == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          titre="Le réseau d'annuaires n'est pas encore en ligne"
          existant=$(gh issue list --state open --search "$titre in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existant" ]; then
            gh issue close "$existant" --comment "Premier dépôt réussi : le réseau est en ligne."
          fi
