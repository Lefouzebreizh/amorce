# Lance le pipeline complet (capture, analyse, rapport) pour un audit payé.
#
# Déclenché par `repository_dispatch` depuis `serveur-paiement/`, à la
# confirmation d'un paiement Stripe — voir `audit-landing/serveur-paiement/`.
# **Non exercé depuis une session distante** : aucun paiement réel n'a
# déclenché cet événement, et ce fichier n'a donc jamais tourné pour de
# vrai — même limite que `analyser_captures.py` avant son premier appel réel
# (voir `second-brain/lecons/2026-09-12-cinq-defauts-quun-seul-appel-reel-a-reveles.md`) :
# écrit contre la forme documentée d'un `repository_dispatch` et des trois
# scripts déjà vérifiés séparément, mais l'enchaînement des trois n'a encore
# jamais été mesuré d'un bout à l'autre.
#
# Le runner a du vrai réseau (voir CLAUDE.md §7, radar-pepites) : c'est ce qui
# rend ce pipeline exécutable ici alors qu'il ne l'est pas depuis une session
# distante — api.anthropic.com y est injoignable, pas depuis un runner.
#
# Livraison : l'artefact conserve une copie pour l'équipe, mais ne sert pas
# de livraison client — un lien GitHub peut demander une authentification.
# Si les secrets Resend sont présents, le rapport HTML est joint directement
# au courriel reçu de Stripe.

name: Lancer un audit payé

on:
  repository_dispatch:
    types: [nouvel-audit-paye]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL de la page à auditer'
        required: true

concurrency:
  group: audit-landing-lancer-audit-${{ github.event.client_payload.session_id || github.run_id }}

jobs:
  auditer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL_A_AUDITER: ${{ github.event.client_payload.url || inputs.url }}
      EMAIL_CLIENT: ${{ github.event.client_payload.email || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install playwright anthropic

      - name: Chromium
        run: python3 -m playwright install --with-deps chromium

      - name: Capturer la page
        run: |
          python3 audit-landing/capturer_page.py "$URL_A_AUDITER" --sortie audit-landing/captures/

      - name: Analyser et rendre le rapport
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DOSSIER=$(find audit-landing/captures -mindepth 1 -maxdepth 1 -type d | head -1)
          python3 audit-landing/analyser_captures.py "$DOSSIER"
          python3 audit-landing/rapport_html.py "$DOSSIER"
          echo "DOSSIER_RAPPORT=$DOSSIER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rapport-audit
          path: ${{ env.DOSSIER_RAPPORT }}/rapport.html
          retention-days: 30

      - name: Livrer le rapport par e-mail
        if: ${{ env.EMAIL_CLIENT != '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_EXPEDITEUR: ${{ secrets.RESEND_EXPEDITEUR }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_EXPEDITEUR" ]; then
            echo "Rapport créé, mais livraison e-mail non configurée." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          with open(os.path.join(os.environ['DOSSIER_RAPPORT'], 'rapport.html'), 'rb') as rapport:
              contenu = base64.b64encode(rapport.read()).decode('ascii')

          charge = {
              'from': os.environ['RESEND_EXPEDITEUR'],
              'to': [os.environ['EMAIL_CLIENT']],
              'subject': 'Votre audit de page de vente',
              'html': '<p>Bonjour,</p><p>Votre audit est prêt. Le rapport HTML est joint à ce message.</p>',
              'attachments': [{'filename': 'audit-page-de-vente.html', 'content': contenu}],
          }
          requete = urllib.request.Request(
              'https://api.resend.com/emails',
              data=json.dumps(charge).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['RESEND_API_KEY']}",
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(requete, timeout=30) as reponse:
              if not 200 <= reponse.status < 300:
                  raise RuntimeError(f'Livraison refusée : HTTP {reponse.status}')
          PY
