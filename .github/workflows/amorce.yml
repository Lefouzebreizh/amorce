# Vérification du studio Amorce — la barrière d'avant-poussée, rejouée sur une
# machine neutre.
#
# Ce workflow ne couvre que ce qui est calculable hors navigateur : typage, lint
# et tests unitaires, rendus en une quarantaine de secondes.
#
# Le parcours `npm run verify` a désormais **son propre workflow**,
# `amorce-verify.yml`. Ce commentaire affirmait jusqu'ici qu'il était trop
# instable pour servir de barrière ; c'était une supposition, et la mesure l'a
# démentie — 85 vérifications sur 85, deux passages de suite, verdict identique.
# Il est séparé non par méfiance mais par vitesse : faire attendre quatre minutes
# de navigateur à un typage qui répond en quarante secondes coûterait ce délai à
# chaque poussée.
#
# Les trois étapes sont séparées pour que le résumé dise laquelle a cassé, et
# `!cancelled()` les laisse toutes parler : un typage rouge n'empêche pas de
# savoir si les tests le sont aussi.

name: Amorce

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/amorce.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/amorce.yml'
  workflow_dispatch:

concurrency:
  group: amorce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Typer, linter, tester
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 22 au minimum : `npm test` lit du TypeScript directement, par
      # `--experimental-strip-types`, qui n'existe pas avant la 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` et non `npm install` : la première respecte le verrou à la
      # lettre et échoue s'il a dérivé du package.json, la seconde le réécrit en
      # silence — ce qui ferait vérifier autre chose que ce qui est versionné.
      - name: Installer les dépendances
        run: npm ci

      - name: Typer
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Linter
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tester
        if: ${{ !cancelled() }}
        run: npm test
