name = "amorce-comptes"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

# Les origines autorisées à interroger ce serveur. Jamais « * » — voir
# licence-serveur/wrangler.toml pour la même raison.
[vars]
ORIGINES = "https://amorce.vercel.app"
# Les paliers restent vides tant que le prix des packs n'est pas décidé — le
# webhook ignore alors tout paiement sans le perdre, voir src/index.ts.
PACKS = "{}"

[[d1_databases]]
binding = "BASE"
database_name = "amorce-comptes"
database_id = "À REMPLIR — voir README.md"

# SECRET_JETONS, SECRET_WEBHOOK, CLE_RESEND, EXPEDITEUR, ADRESSE_SITE ne sont
# pas ici : ce sont des secrets. `wrangler secret put <NOM>`, un par un.
