[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moteur-administratif"
version = "0.1.0"
description = "Moteur partagé pour les produits administratifs personnels (lecture de document, délais légaux, écrits prêts à signer, rappels)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
include = ["moteur_administratif*"]
