# NexusCrypto — tous les paramètres ajustables du système.
#
# Rien de ce fichier n'est un secret : les clés d'API et l'URL de crochet
# Discord vivent dans `.env`, jamais ici. Ce fichier-ci est
# versionné, il se relit en revue, et c'est précisément pour cela qu'il ne doit
# rien contenir qu'on regretterait de publier.
#
# Un réglage se change ici et nulle part ailleurs. Un seuil écrit en dur dans le
# code est un seuil qu'on ne retrouve plus au moment où il faut le bouger.

# --------------------------------------------------------------------------
# Général
# --------------------------------------------------------------------------
general:
  # Le mode par défaut est la simulation, et ce défaut n'est pas négociable :
  # le passage en réel se fait par un argument explicite de la ligne de
  # commande, jamais par ce fichier. Un `config.yaml` mal recopié ne doit pas
  # pouvoir engager d'argent.
  devise: USDT
  intervalle_bougies: 4h
  profondeur_bougies: 300      # ~50 jours en 4h : de quoi calculer une EMA 200
  periode_boucle_secondes: 3600
  journal_niveau: INFO

# --------------------------------------------------------------------------
# Portefeuille — une liste de surveillance, plus de cible à sommer
# --------------------------------------------------------------------------
#
# Retiré le 10/09/2026, avec le DCA calendaire : plus de poids figés à sommer
# à 100 %. Chaque ligne est un actif que le moteur regarde à chaque passe ;
# c'est le score de confiance (`strategie.seuil_achat` ci-dessous), jamais un
# pourcentage de ce fichier, qui décide s'il achète et combien — via
# `risk_management.sizing`, sur la distance au stop.
portefeuille:
  # Capital de départ RÉEL fixé à 50 € par le propriétaire le 10/09/2026 —
  # mais ce chiffre n'est **pas** recopié ici tel quel. Sous l'ancien moteur à
  # DCA, le faire tombait l'enveloppe hebdomadaire et le plafond des pépites
  # dans l'incohérence avec 50 $ de capital total, et sept tests rejouant ce
  # fichier passaient au rouge. Le retrait de l'enveloppe DCA lève cette
  # incohérence précise — il ne reste plus que le plafond des pépites
  # (`strategie.pepites.plafond_par_jeton_usd`, 100 $) et le montant minimum
  # d'ordre (`risque.montant_minimum_usd`, 20 $) à confronter à 50 $ de
  # capital, ce qui reste jouable sur une seule ligne à la fois. Mais passer
  # ce nombre en production reste une décision de produit distincte, qui
  # attend le garde-fou de `config/validation.yaml` (backtest multi-régimes
  # et paper trading documentés) avant d'engager le moindre euro réel. En
  # attendant cet arbitrage, la valeur livrée reste celle qui fait tourner la
  # suite de tests et le rejeu : 10 000 $.
  capital_initial_usd: 10000
  watchlist:
    BTC/USDT:
      role: socle
      # Le socle ne se vend pas sur signal technique : c'est la réserve, et la
      # seule chose qui la fait bouger est un choix explicite.
      vente_sur_signal: false
    SOL/USDT:
      role: croissance
      vente_sur_signal: true
    ETH/USDT:
      role: croissance
      vente_sur_signal: true
    HYPE/USDC:
      role: watchlist
      vente_sur_signal: true
      plateforme: hyperliquid
    LINK/USDT:
      role: watchlist
      vente_sur_signal: true

# --------------------------------------------------------------------------
# Sources de données
# --------------------------------------------------------------------------
sources:
  marche:
    plateformes: [binance, bybit]
    plateforme_defaut: binance
    hyperliquid_api: https://api.hyperliquid.xyz/info
    profondeur_carnet: 20
  onchain:
    defillama_api: https://api.llama.fi
    dexscreener_api: https://api.dexscreener.com/latest/dex
    # Les protocoles suivis pour la TVL, par actif.
    protocoles:
      SOL/USDT: [jito-liquid-staking, raydium-amm]
      ETH/USDT: [lido, aave-v3]
      HYPE/USDC: [hyperliquid-spot]
  sentiment:
    fear_greed_api: https://api.alternative.me/fng/
    reddit_api: https://www.reddit.com/r/CryptoCurrency/hot.json
    # Le NLP est un lexique pondéré, pas un modèle : voir le bloc d'en-tête de
    # `src/data_engine/sentiment.py` pour la raison, qui est mesurée.
    mentions_minimum: 15
  macro:
    flux_rss:
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://cointelegraph.com/rss
      - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    fenetre_heures: 24

# --------------------------------------------------------------------------
# Réseau
# --------------------------------------------------------------------------
reseau:
  delai_secondes: 15
  tentatives: 3
  attente_initiale_secondes: 1.0     # doublée à chaque échec
  requetes_par_minute: 45            # limite globale, tous points d'entrée
  agent_utilisateur: NexusCrypto/1.0

# --------------------------------------------------------------------------
# Stratégie
# --------------------------------------------------------------------------
strategie:
  # Pondérations du score de confiance. Elles doivent sommer à 1.0.
  #
  # Le technique domine parce que c'est la seule des trois familles qui soit
  # mesurée sur des données que personne ne peut fabriquer : un carnet et des
  # bougies. Le sentiment est le plus manipulable des trois, il pèse le moins.
  poids:
    technique: 0.5
    sentiment: 0.2
    onchain: 0.3
  # Quand une famille est absente, son poids est redistribué sur les autres
  # plutôt que compté à zéro — sans quoi une panne de DeFiLlama ferait passer
  # tous les scores sous le seuil d'achat, et le système s'arrêterait d'acheter
  # pour une raison qui n'a rien à voir avec le marché.
  redistribuer_poids_absents: true
  technique:
    rsi_periode: 14
    rsi_survente: 30
    rsi_surachat: 70
    ema_courte: 21
    ema_moyenne: 50
    ema_longue: 200
    volume_periode: 20
    # Noter l'écart à l'EMA longue par rapport à sa **propre distribution**
    # plutôt que sur des seuils absolus.
    #
    # Mesuré sur cinq fenêtres de BTC réel (2016→2025), gain moyen sur le prix
    # d'achat contre un DCA aveugle :
    #
    #            absolu    relatif
    #   moyenne   −3,4 %    +1,7 %
    #   pire cas −27,4 %   −10,2 %   ← 2020-2021, la grande hausse
    #
    # Le mode relatif est meilleur sur la moyenne **et** sur le pire cas : en
    # tendance, le prix vit durablement au-delà de +30 % de son EMA 200, et les
    # seuils absolus collent alors la note à zéro toute la période. Il n'est pas
    # meilleur partout — il perd 10 points sur 2023-2025 — mais il supprime le
    # cas catastrophique, et c'est ce qui décide.
    ecart_ema_relatif: true
  # Score de confiance à partir duquel le moteur achète ou renforce. Retiré le
  # 10/09/2026 avec lui tout le bloc `dca` (calendrier, multiplicateurs de
  # zone, plancher de discipline) : plus de calendrier à honorer, plus de
  # montant nominal à moduler — une opportunité ou rien. Valeur posée à dire
  # sur le fabriqué (§ profils.py), à confronter au réel avant tout capital.
  seuil_achat: 60
  pepites:
    # Croissance de volume exigée par rapport à la moyenne de la fenêtre.
    croissance_volume_min: 3.0
    liquidite_min_usd: 250000
    age_minimum_heures: 72
    variation_liquidite_24h_min: 0.15
    # Aligné le 11/09/2026 sur pepites/config/reglages.yaml (30 M$), sur
    # décision explicite du propriétaire : les deux modules visaient le même
    # mot « pépite » avec un plafond dix fois plus large ici.
    capitalisation_max_usd: 30000000
    score_minimum: 65
    candidats_max: 5
    # Plafond par jeton découvert, tous renforcements compris. Vivait sur
    # `portefeuille.reserve_decouverte` avant le 10/09/2026 ; c'est une notion
    # propre au jeton découvert, pas au portefeuille cible qui n'existe plus.
    plafond_par_jeton_usd: 100
    # Décidé le 11/09/2026 : une pépite du scanner n'a pas de bougies, donc pas
    # d'ATR — son stop est un pourcentage fixe du prix d'entrée. 15 % est une
    # proposition, pas une valeur mesurée : à confirmer par le propriétaire
    # avant toute fusion qui active ce chemin (garde-fou permanent).
    stop_pct: 0.15
    # Vide à dessein — même décision que `TARIFS` vide dans
    # generation-serveur/ : sans terme configuré ici, aucun appel réseau de
    # découverte n'a lieu. Remplir cette liste de mémoire donnerait une
    # découverte qui a l'air de marcher sans jamais avoir été vérifiée à sa
    # source (GeckoTerminal, DexScreener... sont refusés depuis une session
    # distante — voir CLAUDE.md §7).
    termes_recherche: []

  # ------------------------------------------------------------------------
  # Bouclier anti-rugpull — un veto, pas une note.
  #
  # Le scanner repère une anomalie de volume ; il ne sait pas si le jeton est
  # revendable. GoPlus lit le contrat, honeypot.is simule un achat puis une
  # revente (Ethereum, BNB Chain, Base seulement), RugCheck couvre Solana. Les
  # trois répondent sans clé d'API : un garde-fou qui dépend d'un abonnement
  # est un garde-fou qu'on finira par désactiver.
  #
  # `acheter_si_inconnu: false` est le réglage qui mérite d'être discuté. Un
  # service muet bloque l'achat, ce qui coûte des occasions. L'asymétrie le
  # justifie : une occasion manquée coûte un gain, un jeton dont on ne peut pas
  # sortir coûte la ligne entière.
  # ------------------------------------------------------------------------
  bouclier:
    actif: true
    acheter_si_inconnu: false
    taxe_achat_max_pct: 10
    taxe_vente_max_pct: 10
    lp_verrouillee_min_pct: 50
    top10_detenteurs_max_pct: 50
    # Plafond global des trois appels, lancés en parallèle. Une pépite se
    # décide en secondes ; au-delà, le bouclier tranche sur ce qu'il a.
    delai_s: 8

# --------------------------------------------------------------------------
# Risque
# --------------------------------------------------------------------------
risque:
  # Fraction du capital total risquée sur une entrée, avant tout levier.
  #
  # **Mesuré inerte sous l'ancien moteur à DCA**, et il faut le savoir avant de
  # croire que le dimensionnement suit systématiquement le risque. Sur 158
  # dimensionnements d'un rejeu multi-actifs mesurés avant le retrait du DCA
  # (10/09/2026), le plafond qui mordait était l'enveloppe DCA (62 %) ou
  # l'exposition par actif (38 %) — celui-ci **jamais**. Sous le nouveau moteur
  # d'opportunité pure, le montant demandé n'est plus une petite enveloppe
  # nominale mais la valeur totale du portefeuille (voir `strategy/moteur.py`)
  # : c'est ce plafond-ci qui doit désormais mordre le premier. À revérifier
  # par un rejeu une fois le moteur d'opportunité mesuré sur données réelles.
  risque_par_position: 0.01
  # Plafond de la valeur d'une ligne, tous renforcements compris.
  #
  # Mesuré sur trois fenêtres de BTC + ETH + LINK réels, gain par unité de
  # recul exposé :
  #
  #   exposition   2018-21   2022-26   tout   moyenne   recul (tout)
  #      55 %        8,05      2,25    7,93     6,08       81,3 %
  #      75 %        9,71      2,36   10,00     7,36       80,3 %   ← retenu
  #      85 %       10,13      2,36   10,51     7,67       80,1 %
  #      95 %       10,13      2,36   10,51     7,67       80,1 %
  #
  # Desserrer améliore le rendement **et** le recul en même temps : l'arbitrage
  # attendu n'existe pas ici, parce qu'un plafond serré force la trésorerie à
  # dormir au lieu de se répartir sur les autres lignes.
  #
  # 75 % plutôt que 85 % : au-delà de 85 % le plafond ne mord plus jamais — les
  # deux dernières lignes du tableau sont identiques — et il cesse donc d'être
  # un garde-fou. Les 0,31 de gain supplémentaire s'achèteraient en supprimant
  # la seule limite de concentration du portefeuille. À 75 %, elle tient encore.
  exposition_max_par_actif: 0.75
  # Stop-loss dynamique : multiple de l'ATR sous le prix d'entrée.
  atr_periode: 14
  # Mesuré sur trois fenêtres de BTC + ETH + LINK réels, gain par unité de
  # recul exposé :
  #
  #   stop    2018-21   2022-26   tout    moyenne
  #    2,5      4,96      2,27     7,28     4,84
  #    4        8,05      2,25     7,93     6,08   ← retenu
  #    6        8,23      2,21     7,95     6,13
  #
  # À 2,5, les stops liquidaient ETH et LINK dix-neuf fois en quatre ans et le
  # portefeuille finissait concentré sur le seul actif qu'il est interdit de
  # vendre. Desserrer à 4 fait passer le rendement de +305 % à +498 % sur
  # 2018-2021 pour **un demi-point** de recul exposé en plus : l'arbitrage
  # supposé entre rendement et protection n'existait presque pas à ce réglage.
  #
  # 4 plutôt que 6 : l'essentiel du gain est dans le pas de 2,5 à 4, le reste
  # n'ajoute rien (+0,05) et coûte du recul sur la fenêtre longue. Et couper
  # les stops complètement est **pire** que 4 — ils servent, mais pas si serrés.
  atr_multiple_stop: 4.0
  # Prise de bénéfice suiveuse : déclenchée au-delà de ce gain, puis elle suit
  # le plus haut atteint à cette distance.
  trailing_activation: 0.20
  trailing_distance: 0.12
  # Un achat sous ce montant coûte plus en frais qu'il n'apporte. Vivait sur
  # `strategie.dca.montant_minimum_usd` avant le 10/09/2026.
  montant_minimum_usd: 20
  coupe_circuit:
    # Perte journalière du portefeuille au-delà de laquelle tout s'arrête.
    drawdown_journalier_max: 0.07
    # Perte depuis le plus haut historique du portefeuille.
    drawdown_total_max: 0.25
    # Chute d'un actif sur la dernière heure : au-delà, on ne rattrape pas un
    # couteau qui tombe, on attend la reprise du calme.
    chute_marche_1h: 0.12
    # Une actualité macro critique suspend les entrées le temps qu'elle sorte
    # de la fenêtre.
    suspendre_sur_actualite_critique: true
    # Échecs réseau consécutifs au-delà desquels on considère qu'on ne voit
    # plus le marché. Acheter à l'aveugle est pire que ne pas acheter.
    echecs_reseau_max: 5
    # Durée de la coupure avant réarmement automatique.
    refroidissement_minutes: 180

# --------------------------------------------------------------------------
# Exécution
# --------------------------------------------------------------------------
execution:
  plateforme: binance
  type_ordre: marche
  # Simulation réaliste : ces trois nombres sont ce qui sépare un rapport de
  # simulation crédible d'un rapport flatteur. Les frais sont ceux d'un compte
  # sans remise, le glissement est mesuré contre la profondeur du carnet quand
  # elle est disponible, et le taux de base sert de repli quand elle ne l'est
  # pas.
  simulation:
    frais_taker: 0.001
    frais_maker: 0.0002
    glissement_base: 0.0005
    # Part de la profondeur du carnet au-delà de laquelle l'ordre est découpé.
    part_carnet_max: 0.1
  # Écart maximal toléré entre le prix attendu et le prix obtenu. Au-delà,
  # l'ordre est annulé plutôt qu'exécuté à n'importe quel prix.
  glissement_max_tolere: 0.01

# --------------------------------------------------------------------------
# Notifications
# --------------------------------------------------------------------------
notifications:
  # Telegram a été retiré le 10/09/2026 : les résultats se lisent directement
  # dans une session Claude. `console` (capturé par le journal) suffit à cet
  # usage.
  canaux: [console]          # console | discord
  alerter_sur:
    - signal
    - ordre
    - coupe_circuit
    - recapitulatif
  # Heure UTC du récapitulatif quotidien de PnL.
  heure_recapitulatif: 18
