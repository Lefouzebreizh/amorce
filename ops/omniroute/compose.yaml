name: amorce-omniroute-pilot

services:
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      HOSTNAME: 0.0.0.0
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_HOST: 0.0.0.0
      API_PORT: "20129"
      REQUIRE_API_KEY: "true"
      JWT_SECRET: ${JWT_SECRET:?Run prepare.py first}
      API_KEY_SECRET: ${API_KEY_SECRET:?Run prepare.py first}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Run prepare.py first}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Run prepare.py first}
      STORAGE_ENCRYPTION_KEY_VERSION: v1
      OMNIROUTE_DISABLE_BACKGROUND_SERVICES: "true"
      OMNIROUTE_ENABLE_LIVE_WS: "false"
      OPENROUTER_PROVIDER_STATS_ENABLED: "false"
      ARENA_ELO_SYNC_ENABLED: "false"
      PRICING_SYNC_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_LOG_LEVEL: warn
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - data:/app/data
    networks: [isolated]
    healthcheck:
      test: [CMD, node, healthcheck.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  isolated:
    internal: true

volumes:
  data:
