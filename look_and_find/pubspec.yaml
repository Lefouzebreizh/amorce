name: look_and_find
description: "Photographiez un objet, retrouvez-le au meilleur prix et projetez-le chez vous en réalité augmentée."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

# Versions figées au moment de la mise en place, et `pubspec.lock` versionné :
# une application (par opposition à une bibliothèque) doit se reconstruire à
# l'identique, sinon une régression d'un greffon caméra ou d'une visionneuse 3D
# arrive sans être passée par une relecture.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  dio: ^5.11.0
  hive_flutter: ^1.1.0
  camera: ^0.12.0+2
  image: ^4.9.2
  intl: ^0.20.3
  model_viewer_plus: ^1.10.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_tts: ^4.2.5
  google_mlkit_image_labeling: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
